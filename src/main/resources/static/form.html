
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Jogador</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topo">

  <h1>Gerenciador de Jogadores de Futebol</h1>

</header>

<main class="container">

  <section class="painel formulario">

    <h2 id="tituloForm">Incluir novo jogador</h2>

    <p id="mensagem" class="mensagem"></p>

    <form id="jogadorForm">

      <div class="campo">

        <label for="nome">Nome</label>

        <input
          type="text"
          id="nome"
          name="nome"
          required
          minlength="2"
        >

      </div>

      <div class="campo">

        <label for="numeroCamisa">
          Número da camisa
        </label>

        <input
          type="number"
          id="numeroCamisa"
          name="numeroCamisa"
          required
          min="1"
          max="99"
        >

      </div>

      <div class="campo">

        <label for="time">Time</label>

        <input
          type="text"
          id="time"
          name="time"
          required
          minlength="2"
        >

      </div>

      <fieldset class="campo">

        <legend>Lesionado</legend>

        <label class="radio">

          <input
            type="radio"
            name="lesionado"
            value="false"
            required
          >

          Não

        </label>

        <label class="radio">

          <input
            type="radio"
            name="lesionado"
            value="true"
          >

          Sim

        </label>

      </fieldset>

      <div class="campo">

        <label for="observacoes">
          Observações
        </label>

        <textarea
          id="observacoes"
          name="observacoes"
          rows="4"
        ></textarea>

      </div>

      <div class="acoes-form">

        <button type="submit" class="botao">
          Salvar
        </button>

        <a href="index.html" class="botao secundario">
          Cancelar
        </a>

      </div>

    </form>

  </section>

</main>

<footer>

  <p>Nome aluno 1 / Nome aluno 2 / Turma / Ano</p>

  <p>
    Usou IA: SIM/NÃO.
    Ferramentas utilizadas e onde foram usadas:
    preencher conforme o uso real.
  </p>

</footer>

<script src="form.js"></script>

</body>
</html>
